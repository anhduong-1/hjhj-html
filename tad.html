
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái tim Linh Hoa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #fff2f6 0%, #ffe1eb 35%, #ffd3df 100%);
            font-family: "Segoe UI", Tahoma, sans-serif;
            overflow: hidden;
        }

        .scene {
            text-align: center;
        }

        .heart-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
            filter: drop-shadow(0 25px 30px rgba(255, 79, 129, 0.35));
        }

        .heart {
            position: relative;
            width: 240px;
            height: 240px;
            background: linear-gradient(135deg, #ff5a8a, #ff2b68);
            transform: rotate(-45deg);
            animation: beat 1.1s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50%;
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            20% {
                transform: rotate(-45deg) scale(1.08);
            }
            40% {
                transform: rotate(-45deg) scale(0.96);
            }
            60% {
                transform: rotate(-45deg) scale(1.12);
            }
        }

        .message {
            color: #8b1e3f;
        }

        .message h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: pulseText 1.2s ease-in-out infinite;
        }

        .message p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        @keyframes pulseText {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        .spark {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            animation: float 2.5s infinite ease-in-out;
        }

        .spark:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
        .spark:nth-child(2) { top: 18%; right: 16%; animation-delay: 0.5s; }
        .spark:nth-child(3) { bottom: 16%; left: 20%; animation-delay: 1s; }
        .spark:nth-child(4) { bottom: 18%; right: 18%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }
            50% {
                transform: translateY(-16px) scale(1.2);
                opacity: 1;
            }
        }

        .music-box {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .music-btn {
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff7aa9, #ff4f81);
            color: white;
            font-weight: 600;
            padding: 10px 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 79, 129, 0.35);
            transition: transform 0.2s ease;
        }

        .music-btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        audio {
            width: 220px;
            height: 32px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="heart-wrap">
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <div class="heart"></div>
        </div>

        <div class="message">
            <h1>con cho Linh Hoa</h1>
            <p>Trái tim này luôn thuộc về em, Linh Hoa 💖</p>
        </div>

        <div class="music-box">
            <button class="music-btn" id="musicToggle">▶ </button>
            <audio id="bgMusic" loop preload="auto">
                <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9324f7d93a.mp3?filename=happy-bells-113909.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const toggle = document.getElementById('musicToggle');

        toggle.addEventListener('click', async () => {
            try {
                if (music.paused) {
                    await music.play();
                    toggle.textContent = '⏸ Tắt nhạc';
                } else {
                    music.pause();
                    toggle.textContent = '▶';
                }
            } catch (err) {
                console.log('Không thể phát nhạc ngay: ', err);
            }
        });
    </script>
</body>
</html>
